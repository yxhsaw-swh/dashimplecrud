<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - ADS System</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: #121212;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: white;
        }

        .main-content {
            max-width: 700px;
            margin: auto;
        }

        .card-form {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .form-header h2 {
            color: #007bff;
        }

        .form-header p {
            color: #bbb;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #252525;
            color: white;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .flex-1 {
            flex: 1;
        }

        .form-actions {
            margin-top: 20px;
        }

        .btn-save {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-cancel {
            margin-left: 15px;
            color: #bbb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="main-content">

        <section class="card-form">

            <div class="form-header">
                <h2>Novo Usuário</h2>
                <p>Preencha os dados abaixo para registrar um novo acesso.</p>
            </div>

            <form id="form-usuario">

                <div class="form-group">
                    <label for="nome">Nome Completo</label>

                    <input type="text"
                        id="nome"
                        placeholder="Ex: Yasmin Neves"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>

                    <input type="email"
                        id="email"
                        placeholder="nome@unifev.edu.br"
                        required>
                </div>

                <div class="form-row">

                    <div class="form-group flex-1">
                        <label for="senha">Senha</label>

                        <input type="password"
                            id="senha"
                            required>
                    </div>

                    <div class="form-group flex-1">
                        <label for="nivel">Nível</label>

                        <select id="nivel">
                            <option value="1">Usuário</option>
                            <option value="2">Administrador</option>
                        </select>
                    </div>

                </div>

                <div class="form-actions">

                    <button type="submit"
                        class="btn-save"
                        id="btn-salvar">

                        Finalizar Cadastro

                    </button>

                    <a href="usuarios.html"
                        class="btn-cancel">

                        Cancelar

                    </a>

                </div>

            </form>

        </section>

    </main>

    <script>
        document.getElementById('ano').textContent = new Date().getFullYear();

        const edit = JSON.parse(sessionStorage.getItem('editUsuario'));

        if (edit) {
            document.getElementById('form-titulo').innerHTML = '<i class="fa-solid fa-user-pen"></i> Editar Usuário';
            document.getElementById('nome').value = edit.dados.nome;
            document.getElementById('email').value = edit.dados.email;
            document.getElementById('senha').value = edit.dados.password;
            document.getElementById('nivel').value = edit.dados.nivel;
        }

        document.getElementById('form-usuario').addEventListener('submit', function (e) {
            e.preventDefault();

            const usuario = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                password: document.getElementById('senha').value,
                nivel: document.getElementById('nivel').value
            };

            const lista = JSON.parse(localStorage.getItem('bancoUsuario')) || [];

            if (edit) {
                lista[edit.index] = usuario;
                sessionStorage.removeItem('editUsuario');
            } else {
                lista.push(usuario);
            }

            localStorage.setItem('bancoUsuario', JSON.stringify(lista));
            window.location.href = 'usuario.html';
        });
    </script>

</body>

</html>
